<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Defesa Civil - Rio do Sul</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body { margin:0; font-family: Arial; background:#f5f5f5; }
.header { background:#2f1a6b; text-align:center; padding:10px; }
.header img { max-height:120px; }
.titulo { background:#e57200; color:white; text-align:center; padding:10px; font-weight:bold; }
#map { height:60vh; }
form { padding:15px; background:white; }
input, select, textarea, button {
  width:100%; margin:6px 0; padding:10px;
}
button {
  background:#2f1a6b; color:white; border:none; cursor:pointer;
}
button:hover { background:#4527a0; }
.loading {
  opacity: 0.6;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="header">
  <img src="img/logo.png">
</div>

<div class="titulo">
  Sistema de Registro de Ocorrências
</div>

<div id="map"></div>

<form id="form">
  <label>Tipo:</label>
  <select id="tipo">
    <option>Alagamento</option>
    <option>Deslizamento</option>
    <option>Inundação</option>
    <option>Produtos Perigosos</option>
    <option>Queda de árvore</option>
    <option>Queda de muro</option>
    <option>Vendaval</option>
  </select>

  <label>Descrição:</label>
  <textarea id="descricao"></textarea>

  <label>Status:</label>
  <select id="status">
    <option>Aberto</option>
    <option>Em atendimento</option>
    <option>Aguardando Engenharia</option>
    <option>Atendido</option>
  </select>

  <button type="submit">Registrar Ocorrência</button>
</form>

<script>
const SUPABASE_URL = "https://cdnrzjxxbjuqzyrjsfsf.supabase.co";
const SUPABASE_KEY = "sb_publishable_RBZteak4ZHZnfGFW5Zehbg_A_njuC_4";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// MAPA
const map = L.map('map').setView([-27.21, -49.64], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let marcador = null;
let camada = null;
let carregando = false;

// ÍCONES POR TIPO
function getIcon(tipo) {
  let cor = "red";

  switch(tipo) {
    case "Alagamento": cor = "blue"; break;
    case "Deslizamento": cor = "orange"; break;
    case "Inundação": cor = "darkblue"; break;
    case "Produtos Perigosos": cor = "purple"; break;
    case "Queda de árvore": cor = "green"; break;
    case "Queda de muro": cor = "gray"; break;
    case "Vendaval": cor = "yellow"; break;
  }

  return new L.Icon({
    iconUrl: `https://maps.google.com/mapfiles/ms/icons/${cor}-dot.png`,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -32]
  });
}

// CARREGAR
async function carregarOcorrencias() {
  if (carregando) return;
  carregando = true;

  const { data, error } = await client.rpc('get_ocorrencias_geo');

  if (error) {
    console.error("Erro ao carregar:", error);
    carregando = false;
    return;
  }

  if (camada) map.removeLayer(camada);

  camada = L.geoJSON(data.map(o => ({
    type: "Feature",
    geometry: {
      type: "Point",
      coordinates: [o.longitude, o.latitude]
    },
    properties: o
  })), {
    pointToLayer: (feature, latlng) => {
      return L.marker(latlng, {
        icon: getIcon(feature.properties.tipo)
      });
    },
    onEachFeature: (f, l) => {
      l.bindPopup(`
        <b>${f.properties.tipo}</b><br>
        <b>Status:</b> ${f.properties.status}<br>
        ${f.properties.descricao || ''}<br><br>

        <select onchange="atualizarStatus('${f.properties.id}', this.value)">
          <option ${f.properties.status === 'Aberto' ? 'selected' : ''}>Aberto</option>
          <option ${f.properties.status === 'Em atendimento' ? 'selected' : ''}>Em atendimento</option>
          <option ${f.properties.status === 'Aguardando Engenharia' ? 'selected' : ''}>Aguardando Engenharia</option>
          <option ${f.properties.status === 'Atendido' ? 'selected' : ''}>Atendido</option>
        </select>

        <br><br>
        <button onclick="removerOcorrencia('${f.properties.id}')">
          ❌ Remover
        </button>
      `);
    }
  }).addTo(map);

  carregando = false;
}

// CLICK MAPA
map.on('click', function(e) {
  if (marcador) {
    marcador.setLatLng(e.latlng);
  } else {
    marcador = L.marker(e.latlng).addTo(map);
  }

  window.lat = e.latlng.lat;
  window.lng = e.latlng.lng;
});

// INSERT (CORRIGIDO COM RPC)
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!window.lat) {
    alert("Clique no mapa!");
    return;
  }

  const form = document.getElementById('form');
  form.classList.add('loading');

  const tipo = document.getElementById('tipo').value;
  const descricao = document.getElementById('descricao').value;
  const status = document.getElementById('status').value;

  const { error } = await client.rpc('inserir_ocorrencia', {
    p_tipo: tipo,
    p_descricao: descricao,
    p_status: status,
    p_lat: window.lat,
    p_lng: window.lng
  });

  form.classList.remove('loading');

  if (error) {
    console.error("ERRO:", error);
    alert("Erro: " + error.message);
  } else {
    document.getElementById('descricao').value = "";
    alert("Ocorrência registrada!");
    carregarOcorrencias();
  }
});

// DELETE
async function removerOcorrencia(id) {
  if (!confirm("Remover ocorrência?")) return;

  const { error } = await client
    .from('ocorrencias')
    .delete()
    .eq('id', id);

  if (error) {
    alert("Erro ao remover!");
  } else {
    carregarOcorrencias();
  }
}

// UPDATE
async function atualizarStatus(id, novoStatus) {
  const { error } = await client
    .from('ocorrencias')
    .update({ status: novoStatus })
    .eq('id', id);

  if (error) {
    alert("Erro ao atualizar!");
  } else {
    carregarOcorrencias();
  }
}

setInterval(carregarOcorrencias, 5000);
carregarOcorrencias();
</script>

</body>
</html>
