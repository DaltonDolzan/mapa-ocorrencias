<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Defesa Civil - Rio do Sul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: #2f1a6b;
      text-align: center;
      padding: 10px;
    }

    .header img {
      max-height: 120px;
    }

    .titulo {
      background: #e57200;
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }

    #map {
      height: 60vh;
    }

    form {
      padding: 15px;
      background: white;
    }

    input, select, textarea, button {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      font-size: 14px;
    }

    button {
      background: #2f1a6b;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #4527a0;
    }
  </style>
</head>
<body>

<!-- LOGO -->
<div class="header">
  <img src="img/logo.png" alt="Defesa Civil Rio do Sul">
</div>

<!-- TÍTULO -->
<div class="titulo">
  Sistema de Registro de Ocorrências
</div>

<!-- MAPA -->
<div id="map"></div>

<!-- FORM -->
<form id="form">
  <label>Tipo:</label>
  <select id="tipo">
    <option>Alagamento</option>
    <option>Deslizamento</option>
    <option>Inundação</option>
    <option>Produtor Perigosos</option>
    <option>Queda de árvore</option>
    <option>Queda de muro</option>
    <option>Vendaval</option>
  </select>

  <label>Descrição:</label>
  <textarea id="descricao" placeholder="Descreva a ocorrência"></textarea>

  <button type="submit">Registrar Ocorrência</button>
</form>

<script>
  // 🔥 CONFIGURE AQUI
  const SUPABASE_URL = "https://cdnrzjxxbjuqzyrjsfsf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_RBZteak4ZHZnfGFW5Zehbg_A_njuC_4";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 📍 MAPA
  const map = L.map('map').setView([-27.21, -49.64], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  let marcador;
  let camada;

  // 🔄 carregar ocorrências
  async function carregarOcorrencias() {
    const { data, error } = await client.rpc('get_ocorrencias_geo');

    if (error) {
      console.error("Erro ao carregar:", error);
      return;
    }

    if (camada) map.removeLayer(camada);

    camada = L.geoJSON(data.map(o => ({
      type: "Feature",
      geometry: {
        type: "Point",
        coordinates: [o.longitude, o.latitude]
      },
      properties: {
        id: o.id,
        tipo: o.tipo,
        descricao: o.descricao
      }
    })), {
      onEachFeature: (f, l) => {
        l.bindPopup(`
          <b>${f.properties.tipo}</b><br>
          ${f.properties.descricao}<br><br>
          <button onclick="removerOcorrencia('${f.properties.id}')">
            ❌ Remover
          </button>
        `);
      }
    }).addTo(map);
  }

  // 📍 clique no mapa
  map.on('click', function(e) {
    if (marcador) map.removeLayer(marcador);

    marcador = L.marker(e.latlng).addTo(map);
    window.lat = e.latlng.lat;
    window.lng = e.latlng.lng;
  });

  // ➕ adicionar ocorrência
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!window.lat) {
      alert("Clique no mapa para definir o local!");
      return;
    }

    const tipo = document.getElementById('tipo').value;
    const descricao = document.getElementById('descricao').value;

    const { error } = await client
      .from('ocorrencias')
      .insert([{
        tipo: tipo,
        descricao: descricao,
        geom: `POINT(${window.lng} ${window.lat})`
      }]);

    if (error) {
      alert("Erro ao salvar!");
      console.error(error);
    } else {
      document.getElementById('descricao').value = "";
      carregarOcorrencias();
    }
  });

  // ❌ remover ocorrência
  async function removerOcorrencia(id) {
    if (!confirm("Deseja remover esta ocorrência?")) return;

    const { error } = await client
      .from('ocorrencias')
      .delete()
      .eq('id', id);

    if (error) {
      alert("Erro ao remover!");
    } else {
      carregarOcorrencias();
    }
  }

  // 🔄 auto atualização
  setInterval(carregarOcorrencias, 5000);

  carregarOcorrencias();
</script>

</body>
</html>
